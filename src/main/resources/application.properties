spring.application.name=EveryDayHelp


# ===============================
# DATABASE (FROM ENV VARIABLES)
# ===============================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# ===============================
# SERVER PORT (RENDER)
# ===============================
server.port=${PORT:8080}

spring.mail.host=${SPRING_MAIL_HOST}
spring.mail.port=${SPRING_MAIL_PORT}
spring.mail.username=${SPRING_MAIL_USERNAME}
spring.mail.password=${SPRING_MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true


# import secret file
spring.config.import=optional:classpath:application-secret.properties


spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect


# for limiting the file upload size
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
#max-file-size: Maximum size of a single uploaded file
#max-request-size: Total size of multipart/form-data request

#app.upload.dir=upload

#change app logo
spring.banner.location=classpath:logo.ascii

